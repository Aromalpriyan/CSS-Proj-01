<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Buttons</title>
</head>
<body class="bg-black">
    <div class="text-white p-24 flex justify-center ">
        <div class=" w-[750px] gap-10 flex flex-wrap justify-center items-center">
   
        <button class="text-white bg-pink-600 border-3 border-pink-600 px-6 py-2 font-semibold text-lg rounded-sm cursor-pointer hover:text-pink-600 hover:bg-black">Sign up </button>

        <button class="border-3 border-pink-600 px-6 py-2 text-pink-600 hover:bg-pink-600
        hover:text-white rounded-sm font-semibold text-lg cursor-pointer">Link <i class="fa-solid fa-link pl-2"></i></button>

        <button class="text-white bg-yellow-400 border-3 border-yellow-400 px-6 py-2 text-lg rounded-sm font-semibold cursor-pointer hover:text-yellow-400 hover:bg-black">Login <i class="fa-solid fa-right-to-bracket"></i></button>

        <button class="text-yellow-400 rounded-sm font-semibold text-lg border-3 border-yellow-400 px-6 py-2 hover:bg-yellow-400 hover:text-white cursor-pointer">Search <i class="fa-solid fa-magnifying-glass"></i></button>

        <button class="text-black bg-green-500 rounded-sm font-semibold text-lg border-3 border-green-500 px-6 py-2 hover:bg-black hover:text-green-500 cursor-pointer"><i class="fa-solid fa-circle" style="color: #003e04;"></i> Link-05</button>
        
        <button class="text-green-500 bg-black font-semibold text-lg border-3 border-green-500 px-6 py-2 hover:bg-green-500 hover:text-black cursor-pointer"><i class="fa-solid fa-circle" style="color: #003e04;"></i> Link-06</button>
        
        <button class="bg-gradient-to-r from-purple-800 via-pink-500 to-pink-600 px-6 py-2 text-white hover:text-black font-semibold text-lg cursor-pointer">Play Now <i class="fa-brands fa-google-play"></i></button>
    
        <button class="text-white bg-blue-500 font-semibold text-lg border-3 border-blue-500 px-6 py-2 hover:bg-black hover:text-blue-500 cursor-pointer"> More Articles <i class="fa-solid fa-arrow-right"></i></button>
        
        <div class="border-3 border-stone-400 w-[190px]">
            <button class="text-yellow-400 bg-black rounded-sm font-semibold text-lg border-r border-stone-400 py-2 px-6 hover:bg-black hover:text-white cursor-pointer"> <i class="fa-solid fa-star" style="color: #f5c20c;"></i> Starred </button>
            <button class="py-2 px-2"><i class="fa-solid fa-angle-down" style="color:antiquewhite"></i></button>
        </div>
        

        <div class="p-2 pt-4 relative">
            <button><i  class="fa-solid text-6xl fa-cart-shopping" style="color: antiquewhite; cursor: pointer;"></i></button>
            <span class="text-xl bg-red-500 px-2 rounded-full absolute top-0 right-1 cursor-pointer">0</span>
        </div>
        
        <button class="text-black bg-white rounded-full font-semibold text-lg border-3 border-white px-6 py-2 hover:text-white hover:bg-black cursor-pointer"> <i class="fa-solid fa-circle"></i> Light</button>

        <button class="text-white bg-black rounded-full font-semibold text-lg border-3 border-white px-6 py-2 hover:text-black hover:bg-white cursor-pointer"> <i class="fa-solid fa-circle"></i> Dark</button>

        </div>
        





    </div>
</body>
</html>
